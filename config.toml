[execution]
# 0.01 MATIC net profit floor — lower threshold captures more marginal opportunities
min_profit_matic_wei = "10000000000000000"
# 1.0x: cover gas only, net profit above gas is enough
profit_safety_multiplier_bps = 10000
# Balancer-first waterfall with Aave fallback for mixed routes
flash_loan_source = "auto"

[routing]
# 300: Larger pool for more cycle diversity. LF runs in background with try_lock.
enumeration_max_paths = 500
max_hops = 4
# More Brent iterations reduces probe-only near-misses on flat profit curves.
ternary_search_iterations = 18

[pipeline]
# Hot-pool WSS patches; requires WSS_URL or POLYGON_WSS_URLS in .env
stream_enabled = true
# Per-tick pool refresh cap (hot pools rotate; full sweep every lf_full_sweep_interval passes).
lf_hot_batch = 800
lf_full_sweep_interval = 30
cycle_refind_interval = 8
# Raise sim/score caps to eval more candidates per HF tick -> more chance of net>0 after gas.
hf_sim_cap = 300
hf_score_cap = 400
hf_prefetch_count = 300

[oracle]
pyth_feeds = ""
