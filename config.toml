# Tuned for lowest paid / PAYG tiers (see .env.example provider table):
#   dRPC PAYG state primary ($6/1M req, 5K RPS) — Chainstack Dev 25 RPS or Growth 250 RPS failover
#   Alchemy PAYG execution only (10K CU/s; eth_call=26 CU — keep off state multicall path)
#   Ankr freemium fallback (~30 RPS), PublicNode last resort
#
# Measured from this host: dRPC ~262ms, Alchemy ~468ms, Ankr ~558ms (20-parallel burst: all OK)

lf_interval_ms = 4000
hf_interval_ms = 200
max_multicall_calls = 180

[rpc]
request_timeout_ms = 10000
batch_pace_ms = 8

[execution]
min_profit_matic_wei = "10000000000000000"
profit_safety_multiplier_bps = 25000
flash_loan_source = "auto"

[routing]
enumeration_max_paths = 500
max_hops = 4
ternary_search_iterations = 18

[pipeline]
stream_enabled = true
lf_hot_batch = 400
lf_full_sweep_interval = 60
cycle_refind_interval = 8
hf_sim_cap = 100
hf_score_cap = 120
hf_prefetch_count = 50
hf_prefetch_budget_ms = 2500
hf_max_dispatch = 4

[oracle]
pyth_feeds = ""