[package]
name = "rpbot"
version = "0.1.0"
edition = "2024"
default-run = "rpbot"

[lib]
name = "rpbot"
path = "src/lib.rs"

[[bin]]
name = "rpbot"
path = "src/main.rs"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "oracle_feeds"
path = "src/bin/oracle_feeds.rs"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:libc"]

[dependencies]
alloy = { version = "2.2.0", features = ["reqwest", "pubsub", "provider-ws"] }
hypersync-client = "1.4.0"
anyhow = "1.0.103"
thiserror = "2.0.18"
arc-swap = "1.9.2"
dashmap = "6.2.1"
figment = { version = "0.10.19", features = ["env"] }
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "json", "gzip"] }
ratatui = { version = "0.30.2", optional = true, features = ["crossterm"] }
crossterm = { version = "0.29.0", optional = true, default-features = false, features = ["events", "bracketed-paste"] }
libc = { version = "0.2", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
rustc-hash = "2.1.3"
rayon = "1.12.0"
smallvec = "1.15.2"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.1"
futures-util = "0.3.32"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
proptest = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "routing"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false

[profile.dev]
debug = 0
split-debuginfo = "unpacked"

[lints.clippy]
  all = { level = "warn", priority = -1 }
  unwrap_used = "deny"
  panic = "deny"
  todo = "deny"
  unimplemented = "deny"
  disallowed_types = "deny"
  disallowed_macros = "deny"
  explicit_counter_loop = "warn"
  manual_clamp = "warn"
  match_same_arms = "warn"
  manual_let_else = "warn"
  return_self_not_must_use = "warn"
