[package]
name = "rpbot"
version = "0.1.0"
edition = "2024"
default-run = "rpbot"

[lib]
name = "rpbot"
path = "src/lib.rs"

[[bin]]
name = "rpbot"
path = "src/main.rs"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[features]
# Production path is headless (`default = []`). Enable only for the optional `tui` bin.
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:libc"]

[dependencies]
# Defaults already include essentials + `reqwest`/`reqwest-rustls-tls` (alloy feature
# names; those map to reqwest's `rustls`). Add only WS/pubsub.
alloy = { version = "2.2.0", features = ["pubsub", "provider-ws"] }
hypersync-client = "1.4.0"
anyhow = "1.0.104"
arc-swap = "1.9.2"
dashmap = "6.2.1"
figment = { version = "0.10", features = ["env"] }
parking_lot = "0.12"
# Keep default-features=false so system-proxy stays off (we call no_proxy() in infra::http).
# Features mirror 0.13 defaults minus system-proxy, plus json + gzip.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "json", "gzip"] }
# Pin crossterm 0.29 backend; skip unused calendar widget / macros.
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["std", "crossterm_0_29", "layout-cache"] }
crossterm = { version = "0.29.0", optional = true, default-features = false, features = ["events", "bracketed-paste"] }
libc = { version = "0.2.187", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
rustc-hash = "2.1.3"
rayon = "1.12.0"
# union: no discriminant word vs Vec (servo/rust-smallvec README); const_generics: any inline N.
smallvec = { version = "1.15.2", features = ["union", "const_generics"] }
# tokio 1.53 defaults are empty; enable only what we use. `parking_lot` reuses our dep
# for sync primitives inside the runtime. CPU work stays on rayon (not spawn_blocking).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "parking_lot"] }
tokio-postgres = "0.7.18"
# Statement-cached pool for tokio-postgres; Runtime::Tokio1 + Verified recycle in infra::pg.
deadpool-postgres = "0.14.1"
[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# Default features: std + fork + timeout (Proptest 1.11 book quickstart).
proptest = "1.11"
# html_reports is non-default since 0.4; cargo_bench_support comes from default features.
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "routing"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false

[profile.dev]
debug = 0
split-debuginfo = "unpacked"

[lints.clippy]
  all = { level = "warn", priority = -1 }
  unwrap_used = "deny"
  panic = "deny"
  todo = "deny"
  unimplemented = "deny"
  disallowed_types = "deny"
  disallowed_macros = "deny"
  explicit_counter_loop = "warn"
  manual_clamp = "warn"
  match_same_arms = "warn"
  manual_let_else = "warn"
  return_self_not_must_use = "warn"
